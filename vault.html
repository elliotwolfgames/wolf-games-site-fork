<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault — Wolf Games</title>
<meta name="description" content="The Wolf Games Vault — today's pick and the full shelf of live games. A new edition every day.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#181818;
    --fg:#FEFEF9;
    --fg-2:#B9B9B4;
    --fg-3:#7C7C76;
    --line:rgba(255,255,255,.12);
    --yellow:#FAFF00;
    --glass:rgba(255,255,255,.07);
    --glass-line:rgba(255,255,255,.16);
    --display:'Inter Tight','Inter',sans-serif;
    --body:'Inter',sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;}
  :root{color-scheme:dark;}
  [hidden]{display:none!important;}
  html{scroll-behavior:smooth;}
  html,body{overflow-x:clip;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;
    -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--yellow);color:#000;}
  img{max-width:100%;display:block;}
  a{color:inherit;}

  .label{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);font-weight:500;}

  .r{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
  .in .r{opacity:1;transform:none;}
  .r.d1{transition-delay:.08s;} .r.d2{transition-delay:.16s;} .r.d3{transition-delay:.24s;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--yellow);color:#000;
    font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
    text-decoration:none;padding:17px 28px;border-radius:12px;border:0;cursor:pointer;
    box-shadow:0 4px 20px rgba(249,255,0,.3);
    transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(249,255,0,.42);filter:brightness(1.03);}
  .btn .arrow{font-size:17px;line-height:1;transform:translateY(-1px);}
  .btn .tri{width:0;height:0;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent #000;}

  .lnk{font-size:14px;text-decoration:none;border-bottom:1px solid var(--fg-3);padding-bottom:2px;
    transition:border-color .25s,color .25s;}
  .lnk:hover{border-color:var(--yellow);color:var(--yellow);}

  /* ---------- mobile top header + hamburger ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:60;background:linear-gradient(rgba(24,24,24,.9) 40%,transparent);}
  header .hwrap{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,5vw,40px);}
  header .wm{height:38px;width:auto;display:block;}
  header .hright{display:flex;align-items:center;gap:16px;}

  /* streak treatments: the chain must be seen to be unbroken */
  .flame{fill:var(--yellow);stroke:none;filter:drop-shadow(0 0 6px rgba(250,255,0,.5));}
  .streak-top{display:inline-flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:700;color:var(--yellow);letter-spacing:.02em;}
  .streak-top .flame{width:14px;height:14px;}
  .streak-side{display:inline-flex;align-items:center;gap:8px;margin-left:6px;
    font-size:13px;font-weight:600;color:var(--fg);letter-spacing:.04em;}
  .streak-side .flame{width:14px;height:14px;}
  .streak-side b{color:var(--yellow);}
  .burger{position:relative;width:34px;height:20px;background:none;border:0;padding:0;cursor:pointer;}
  .burger i{position:absolute;left:0;right:0;height:2.5px;border-radius:2px;background:var(--yellow);
    transition:transform .35s var(--ease),opacity .25s,top .35s var(--ease);}
  .burger i:nth-child(1){top:0;}
  .burger i:nth-child(2){top:50%;transform:translateY(-50%);}
  .burger i:nth-child(3){top:100%;transform:translateY(-100%);}
  .burger.open i:nth-child(1){top:50%;transform:translateY(-50%) rotate(45deg);}
  .burger.open i:nth-child(2){opacity:0;}
  .burger.open i:nth-child(3){top:50%;transform:translateY(-50%) rotate(-45deg);}
  .menu{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.96);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;
    opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s;}
  .menu.open{opacity:1;visibility:visible;}
  .menu a{font-family:var(--display);font-weight:500;font-size:clamp(40px,7vw,64px);letter-spacing:-.035em;
    line-height:1.2;text-decoration:none;padding:6px 18px;
    background:linear-gradient(270deg,#FEFEF9 0%,#7d7d7d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;transform:translateY(26px);transition:transform .55s var(--ease),opacity .55s var(--ease);}
  .menu.open a{opacity:1;transform:none;}
  .menu.open a:nth-child(1){transition-delay:.08s;}
  .menu.open a:nth-child(2){transition-delay:.16s;}
  .menu.open a:nth-child(3){transition-delay:.24s;}
  .menu a:hover{background:linear-gradient(270deg,var(--yellow),var(--yellow));
    -webkit-background-clip:text;background-clip:text;}
  body.menu-open{overflow:hidden;}

  /* ---------- desktop sidebar ---------- */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:40;
    display:flex;flex-direction:column;gap:28px;padding:30px 22px 26px;
    background:rgba(21,21,21,.85);border-right:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .sidebar .wm{height:26px;width:auto;align-self:flex-start;margin-left:6px;}
  .side-play{width:100%;}
  .snav{display:flex;flex-direction:column;gap:6px;}
  .snav a{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:12px;
    text-decoration:none;font-weight:500;font-size:15px;color:var(--fg-2);
    transition:background .2s,color .2s;}
  .snav a:hover{background:rgba(255,255,255,.06);color:var(--fg);}
  .snav a.active{background:rgba(255,255,255,.08);color:var(--yellow);}
  .snav svg,.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .sidebar .sfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;
    font-size:12.5px;color:var(--fg-3);padding-left:6px;}
  .sidebar .sfoot a{text-decoration:none;transition:color .2s;}
  .sidebar .sfoot a:hover{color:var(--yellow);}

  /* ---------- mobile bottom tab bar ---------- */
  /* grid, not flex: the side tabs each get a 1fr track and center within it,
     so they sit in whatever space is actually left after the middle (auto)
     track — which keeps them clear of the button instead of just splitting
     the bar 50/50 and letting the wide button overlap into both halves */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:55;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:end;
    background:rgba(20,20,20,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:10.5px;letter-spacing:.02em;color:var(--fg-3);text-decoration:none;}
  .tab.active{color:var(--yellow);}
  /* the middle grid track always sits exactly at bar-center (the two 1fr
     tracks on either side are forced equal), so this stays screen-centered */
  .tab-play{justify-self:center;transform:translateY(-18px);min-width:58px;height:58px;border-radius:29px;
    background:var(--yellow);
    display:flex;align-items:center;justify-content:center;padding:0 22px;
    box-shadow:0 6px 26px rgba(249,255,0,.45);border:0;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    text-decoration:none;font-family:var(--body);font-weight:700;font-size:13px;
    letter-spacing:.03em;text-transform:uppercase;color:#000;white-space:nowrap;
    transition:padding .2s var(--ease),border-radius .2s var(--ease);}
  .tab-play i{display:none;width:0;height:0;border-style:solid;border-width:10px 0 10px 16px;
    border-color:transparent transparent transparent #000;}
  /* while a game is open, the "Challenge Me" label becomes a "next game" down-chevron */
  body.playing .tab-play{width:58px;min-width:58px;padding:0;border-radius:50%;}
  body.playing .tab-play .tp-label{display:none;}
  body.playing .tab-play i{display:block;width:15px;height:15px;border-style:solid;border-width:0 3.5px 3.5px 0;
    border-color:#000;border-radius:2px;transform:rotate(45deg);}

  /* ---------- layout shell: one screen, everything reachable without scrolling ---------- */
  main{height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(84px,11vh,100px) clamp(14px,4vw,26px) clamp(104px,14vh,120px);}
  .shell{width:100%;max-width:1060px;flex:1;min-height:0;
    display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px);}
  @media (min-width:900px){
    header,.menu,.tabbar{display:none;}
    main{margin-left:250px;height:100vh;padding:34px clamp(28px,4vw,56px) 38px;}
  }
  @media (max-width:899.98px){
    .sidebar{display:none;}
  }

  /* ---------- the four ---------- */
  .chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:#000;background:var(--yellow);padding:5px 10px;border-radius:6px;}
  .chip::before{content:'';width:5px;height:5px;border-radius:50%;background:#000;}

  .ggrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    gap:clamp(10px,1.6vh,18px);}
  .gtile{position:relative;border-radius:20px;overflow:hidden;background:#101010;
    border:1px solid var(--glass-line);cursor:pointer;display:block;text-decoration:none;
    transition:transform .3s var(--ease),border-color .3s;}
  .gtile:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.34);}
  .gtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;
    transition:transform .7s var(--ease);}
  .gtile:hover img{transform:scale(1.05);}
  .gtile::after{content:'';position:absolute;inset:0;
    background:linear-gradient(transparent 46%,rgba(8,8,8,.88));}
  .gtile .gmeta{position:absolute;left:13px;right:13px;bottom:11px;z-index:2;}
  .gtile .gtitle{font-family:var(--display);font-weight:600;font-size:clamp(15px,1.9vw,20px);
    letter-spacing:-.01em;color:var(--fg);line-height:1.15;}
  .gtile .gmech{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2);
    margin-top:3px;display:block;}
  .gtile .chip{position:absolute;top:10px;left:10px;z-index:2;}
  .gtile .gplays{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;
    background:rgba(12,12,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--fg);}
  .gtile .gplays i{width:0;height:0;border-style:solid;border-width:4px 0 4px 7px;
    border-color:transparent transparent transparent var(--yellow);}

  /* ---------- Public Eye CTA ---------- */
  .pe{position:relative;flex:none;display:flex;align-items:center;gap:14px;
    border-radius:20px;overflow:hidden;border:1px solid var(--glass-line);
    padding:clamp(14px,2vh,20px) clamp(16px,2.4vw,24px);min-height:clamp(92px,13vh,122px);
    text-decoration:none;transition:transform .3s var(--ease),border-color .3s;}
  .pe:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.34);}
  .pe-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;
    filter:saturate(.85);}
  .pe::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(10,10,10,.93) 32%,rgba(10,10,10,.6) 70%,rgba(10,10,10,.35));}
  .pe-meta{position:relative;z-index:2;flex:1;min-width:0;}
  .pe-label{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);}
  .pe-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--yellow);
    box-shadow:0 0 8px var(--yellow);}
  .pe-logo{display:block;height:clamp(38px,6vh,54px);width:auto;margin:5px 0 3px;}
  .pe p{margin:0;font-size:12.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Public Eye red, sampled from the game's own PLAY NOW button (#FF4426) */
  .pe .btn{position:relative;z-index:2;flex:none;padding:13px 20px;font-size:12.5px;border-radius:11px;
    background:#FF4426;color:#121212;box-shadow:0 4px 20px rgba(255,68,38,.38);}
  .pe .btn:hover{box-shadow:0 8px 28px rgba(255,68,38,.52);}
  .pe .btn .tri{border-color:transparent transparent transparent #121212;}

  /* ---------- in-vault game player ---------- */
  .player{position:fixed;z-index:45;left:0;right:0;top:0;bottom:0;
    background:#0b0b0b;display:flex;flex-direction:column;}
  .player[hidden]{display:none;}
  .pbar{flex:none;display:flex;align-items:center;gap:14px;
    padding:10px clamp(14px,2vw,22px);border-bottom:1px solid var(--line);
    background:rgba(21,21,21,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .pback{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
    color:var(--yellow);font-family:var(--body);font-weight:600;font-size:14px;
    padding:9px 11px;border-radius:9px;transition:background .2s;}
  .pback:hover{background:rgba(255,255,255,.06);}
  .ptitle{font-family:var(--display);font-weight:600;font-size:15px;color:var(--fg);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pext{margin-left:auto;font-size:12.5px;color:var(--fg-3);text-decoration:none;white-space:nowrap;}
  .pext:hover{color:var(--yellow);}
  .player iframe{flex:1;width:100%;border:0;background:#000;
    transition:transform .28s var(--ease),opacity .28s var(--ease);}
  .player.adv-out iframe{transform:translateY(-9%);opacity:0;}
  .player.adv-in iframe{transition:none;transform:translateY(9%);opacity:0;}
  body.playing{overflow:hidden;}
  body.playing header{display:none;}
  @media (min-width:900px){.player{left:250px;}}

  /* ambient drifting particles — fixed backdrop behind the shelf, no set direction */
  .particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .particles i{position:absolute;border-radius:50%;opacity:var(--po,.22);
    background:var(--pc,#FEFEF9);box-shadow:0 0 6px 1px var(--pc,#FEFEF9);
    animation:drift var(--pt,14s) ease-in-out infinite alternate;animation-delay:var(--pd,0s);}
  @keyframes drift{
    from{transform:translate(0,0);}
    to{transform:translate(var(--dx,90px),var(--dy,-70px));}}
  @media (prefers-reduced-motion:reduce){.particles{display:none;}}
  main{position:relative;z-index:1;}

  /* day status strip: remaining editions + countdown to the next daily drop */
  .daystat{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;
    background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    padding:clamp(11px,1.6vh,15px) clamp(14px,2vw,20px);}
  .daystat p{margin:0;font-size:clamp(13.5px,1.5vw,15px);color:var(--fg);}
  .daystat p b{color:var(--yellow);}
  .daystat .dcount{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);
    letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap;}
  .daystat .dcount::before{content:'';width:7px;height:7px;border-radius:50%;
    background:var(--yellow);box-shadow:0 0 8px var(--yellow);}

  #banner{display:none;margin-top:40px;padding:18px 22px;border:1px solid var(--glass-line);border-radius:14px;
    background:var(--glass);color:var(--fg-2);font-size:15px;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;}
    html{scroll-behavior:auto;}
    .r{opacity:1;transform:none;}
  }
</style>
</head>

<script>
/* ---- always fetch the latest build of internal pages ---- */
(function(){
  var t=Date.now();
  document.querySelectorAll('a[href$="index.html"],a[href$="vault.html"],a[href$="about.html"],a[href$="profile.html"]').forEach(function(a){
    a.href=a.getAttribute('href')+'?t='+t;
  });
})();

/* ---- ambient drifting particles ---- */
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var el=document.getElementById('pt-vault'); if(!el) return;
  for(var i=0;i<26;i++){
    var p=document.createElement('i');
    var s=(1.4+Math.random()*2.4).toFixed(1);
    /* guarantee a visible amount of travel in a random direction */
    var ang=Math.random()*Math.PI*2, dist=70+Math.random()*80;
    p.style.left=(Math.random()*100).toFixed(2)+'%';
    p.style.top=(Math.random()*100).toFixed(2)+'%';
    p.style.width=s+'px'; p.style.height=s+'px';
    p.style.setProperty('--pt',(10+Math.random()*8).toFixed(1)+'s');
    p.style.setProperty('--pd',(-Math.random()*10).toFixed(1)+'s');
    p.style.setProperty('--dx',Math.round(Math.cos(ang)*dist)+'px');
    p.style.setProperty('--dy',Math.round(Math.sin(ang)*dist)+'px');
    p.style.setProperty('--po',(0.12+Math.random()*0.22).toFixed(2));
    el.appendChild(p);
  }
})();

/* ---- hamburger (mobile) ---- */
(function(){
  var burger=document.getElementById('burger'), menu=document.getElementById('menu');
  function setOpen(open){
    burger.classList.toggle('open',open);
    menu.classList.toggle('open',open);
    document.body.classList.toggle('menu-open',open);
    burger.setAttribute('aria-expanded',open?'true':'false');
  }
  burger.addEventListener('click',function(){setOpen(!menu.classList.contains('open'));});
  menu.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setOpen(false);});});
  window.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
})();

/* ---- in-vault game player ---- */
var WGPlayer=(function(){
  var el=document.getElementById('player'),
      frame=document.getElementById('p-frame'),
      ext=document.getElementById('p-ext'),
      back=document.getElementById('p-back'),
      tabbar=document.querySelector('.tabbar'),
      tabPlay=document.getElementById('tab-play'),
      returnTo=null;

  function setSrc(url){frame.src=url; ext.href=url;}

  function fit(){
    if(el.hidden) return;
    var mobile=window.matchMedia('(max-width: 899.98px)').matches;
    el.style.bottom=(mobile&&tabbar)?tabbar.offsetHeight+'px':'0px';
  }
  function open(url,name,opts){
    if(!el.hidden){
      /* already playing — swipe the current game up and out, next one in from below */
      el.classList.add('adv-out');
      setTimeout(function(){
        setSrc(url);
        el.classList.remove('adv-out'); el.classList.add('adv-in');
        requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.remove('adv-in');});});
      },280);
      return;
    }
    setSrc(url);
    el.hidden=false; document.body.classList.add('playing');
    if(tabPlay) tabPlay.setAttribute('aria-label','Next game');
    document.dispatchEvent(new CustomEvent('wg:player-open'));
    fit();
    /* returnTo: the page we should land on when "Back" is pressed. Only set when the
       player was opened by arriving fresh from another page (e.g. the homepage) — in
       that case skip pushState so a real navigation, not a fake history entry, sends
       the user back to where they actually came from. */
    returnTo=(opts&&opts.returnTo)||null;
    if(!returnTo) history.pushState({wgPlayer:1},'');
  }
  function hide(){
    if(el.hidden) return;
    el.hidden=true; frame.src='about:blank';
    document.body.classList.remove('playing');
    if(tabPlay) tabPlay.setAttribute('aria-label','Challenge me');
    returnTo=null;
    document.dispatchEvent(new CustomEvent('wg:player-hidden'));
  }
  function close(fromPop){
    if(el.hidden) return;
    var to=returnTo;
    hide();
    if(fromPop) return;
    if(to){ location.href=to; return; }
    if(history.state && history.state.wgPlayer) history.back();
  }
  back.addEventListener('click',function(){close(false);});
  window.addEventListener('popstate',function(){close(true);});
  window.addEventListener('resize',fit);
  window.addEventListener('keydown',function(e){if(e.key==='Escape')close(false);});
  /* tapping My Arcade while playing exits back to the shelf instead of reloading */
  document.querySelectorAll('.snav a.active,.tab.active').forEach(function(a){
    a.addEventListener('click',function(e){
      if(!el.hidden){e.preventDefault();hide();}
    });
  });
  return {open:open,close:close,isOpen:function(){return !el.hidden;}};
})();

/* ---- vault shelf ---- */
(function(){
  var MECH={1:'Hypercasual',2:'Competitive',3:'Narrative serial'};
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

  fetch('/data/vault.json',{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error('vault.json '+r.status);
    return r.json();
  }).then(function(data){
    var games=data.games.map(function(g){g.mechanic=g.mechanic||MECH[g.tier]||'Game';return g;});
    var avail=games.filter(function(g){return g.available;});

    /* the four: everything on this screen routes into one of these */
    var FEATURED=['the-stacks','on-the-wire-turns','game-amino-merge','caldera-confidential'];
    var featured=FEATURED.map(function(s){
      return avail.filter(function(g){return g.slug===s;})[0];
    }).filter(Boolean);

    /* ---- player state: streak, day status, instrumentation ---- */
    var S=window.WGVaultState;
    function slugsAll(){ return featured.map(function(g){return g.slug;}); }
    function hashOf(slug){
      var h=0; for(var i=0;i<slug.length;i++){h=(h*33+slug.charCodeAt(i))>>>0;}
      h=(((h^(h>>>7))>>>0)*2654435761)>>>0; return (h^(h>>>16))>>>0;
    }
    function diffFor(slug){ return ['Easy','Medium','Hard'][hashOf(slug)%3]; }

    function updateStreakUI(){
      if(!S) return;
      var s=S.getStreak();
      [['streak-top','streak-top-n'],['streak-side','streak-side-n']].forEach(function(ids){
        var box=document.getElementById(ids[0]), n=document.getElementById(ids[1]);
        if(!box) return;
        box.hidden=s<1;
        if(n) n.textContent=s;
      });
    }
    function fmtMs(ms){
      var h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4);
      return h>0 ? h+'h '+m+'m' : m+'m';
    }
    function updateDayStat(){
      if(!S) return;
      var box=document.getElementById('daystat'); if(!box) return;
      var line=document.getElementById('daystat-line'), count=document.getElementById('daystat-count');
      var st=S.getTodayStatus(slugsAll());
      var total=featured.length, done=st.playedCount;
      box.hidden=false;
      var next='New editions in '+fmtMs(S.msUntilNextDay());
      if(total && done>=total){
        line.innerHTML='You&rsquo;ve cleared the board. New editions tomorrow.';
        var s=S.getStreak();
        count.textContent=(s>=1 ? s+'-day streak · ' : '')+next;
      }else if(done>0){
        line.innerHTML='<b>'+done+'</b> of '+total+' editions played today.';
        count.textContent=next;
      }else{
        line.innerHTML='<b>'+total+'</b> fresh editions today.';
        count.textContent=next;
      }
    }
    function refreshState(){ updateStreakUI(); updateDayStat(); renderTiles(); }

    /* the four double as a playlist: while playing, the tab-bar button advances through them */
    var current=-1;
    function launch(g,url,opts){
      current=featured.indexOf(g);
      if(S) S.recordPlay(g.slug);
      WGPlayer.open(url||g.url,g.title,opts);
      refreshState();
    }
    function playGame(g,opts){ launch(g,null,opts); }
    function nextGame(){
      if(!featured.length) return;
      current=(current+1)%featured.length;
      launch(featured[current]);
    }

    /* Challenge Me: route into one game not yet cleared today, hard titles
       first, with mode=challenge passed through to the client untouched.
       Completion signals from the clients are still TODO, so played-today
       is the working proxy for cleared. */
    function withChallengeMode(url){
      return url+(url.indexOf('?')>-1?'&':'?')+'mode=challenge';
    }
    function challengeMe(){
      var st=S?S.getTodayStatus(slugsAll()):{bySlug:{}};
      var open=WGPlayer.isOpen();
      var notDone=featured.filter(function(g){
        var x=st.bySlug[g.slug]; return !x || !x.played;
      });
      if(!notDone.length){
        /* all cleared: back to the shelf, show the cleared-board state */
        if(open) WGPlayer.close(false);
        refreshState();
        return;
      }
      var pool=notDone.filter(function(g){ return diffFor(g.slug)==='Hard'; });
      if(!pool.length) pool=notDone;
      var g=pool[Math.floor(Math.random()*pool.length)];
      launch(g,withChallengeMode(g.url));
    }

    /* arriving from a game link elsewhere on the site (e.g. homepage) — open straight into the
       player, and remember where we came from so "Back" returns there instead of the shelf */
    var playSlug=new URLSearchParams(location.search).get('play');
    if(playSlug){
      var linked=avail.filter(function(g){return g.slug===playSlug;})[0];
      if(linked){
        var cameFrom=null;
        try{
          if(document.referrer && new URL(document.referrer).origin===location.origin) cameFrom=document.referrer;
        }catch(e){}
        playGame(linked,{returnTo:cameFrom});
      }
    }

    /* the 2x2: art-forward tiles that go straight into the player */
    function renderTiles(){
      var grid=document.getElementById('ggrid'); if(!grid) return;
      var st=S?S.getTodayStatus(slugsAll()):{bySlug:{}};
      grid.innerHTML='';
      featured.forEach(function(g){
        var x=st.bySlug[g.slug]||{};
        var el=document.createElement('a');
        el.className='gtile';
        el.href=g.url; el.target='_blank'; el.rel='noopener';
        el.addEventListener('click',function(e){ e.preventDefault(); playGame(g); });
        var h=hashOf(g.slug);
        var plays=40000+(h%1460000);
        var playsFmt=plays>=1000000?(plays/1000000).toFixed(1)+'M':Math.round(plays/1000)+'K';
        var chip=x.played ? '<span class="chip">Played</span>' : '';
        el.innerHTML=(g.thumb?'<img src="'+esc(g.thumb)+'" alt="">':'')+chip+
          '<span class="gplays"><i></i>'+playsFmt+'</span>'+
          '<div class="gmeta"><div class="gtitle">'+esc(g.title)+'</div>'+
            '<span class="gmech">'+esc(g.mechanic)+'</span></div>';
        grid.appendChild(el);
      });
    }

    var sideBtn=document.getElementById('side-play');
    if(sideBtn) sideBtn.addEventListener('click',function(){ challengeMe(); });
    var tabBtn=document.getElementById('tab-play');
    if(tabBtn) tabBtn.addEventListener('click',function(){
      /* on the shelf it starts a challenge; while playing it swipes to the next game */
      if(WGPlayer.isOpen()) nextGame(); else challengeMe();
    });

    /* ---- boot: state UI, countdown ticker, deep links, completion events ---- */
    refreshState();
    setInterval(updateDayStat,30000);
    document.addEventListener('wg:player-hidden',refreshState);
    if(!playSlug && new URLSearchParams(location.search).get('challenge')) challengeMe();

    /* TODO(games): completion postMessage shape is not finalized in the game
       clients. Listening for {type:'wg:complete', slug}; update this when the
       clients ship a real signal. */
    window.addEventListener('message',function(e){
      var d=e&&e.data;
      if(d && d.type==='wg:complete' && d.slug && S){
        S.recordComplete(d.slug);
        refreshState();
      }
    });
  }).catch(function(e){
    var b=document.getElementById('banner');
    b.style.display='block';
    b.textContent='The shelf is restocking. Check back shortly. ('+e.message+')';
  });
})();
</script>
