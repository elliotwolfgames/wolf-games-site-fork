<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault — Wolf Games</title>
<meta name="description" content="The Wolf Games Vault — today's pick and the full shelf of live games. A new edition every day.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#181818;
    --fg:#FEFEF9;
    --fg-2:#B9B9B4;
    --fg-3:#7C7C76;
    --line:rgba(255,255,255,.12);
    --yellow:#FAFF00;
    --glass:rgba(255,255,255,.07);
    --glass-line:rgba(255,255,255,.16);
    --display:'Inter Tight','Inter',sans-serif;
    --body:'Inter',sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{overflow-x:clip;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;
    -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--yellow);color:#000;}
  img{max-width:100%;display:block;}
  a{color:inherit;}

  .label{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);font-weight:500;}

  .r{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
  .in .r{opacity:1;transform:none;}
  .r.d1{transition-delay:.08s;} .r.d2{transition-delay:.16s;} .r.d3{transition-delay:.24s;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--yellow);color:#000;
    font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
    text-decoration:none;padding:17px 28px;border-radius:12px;border:0;cursor:pointer;
    box-shadow:0 4px 20px rgba(249,255,0,.3);
    transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(249,255,0,.42);filter:brightness(1.03);}
  .btn .arrow{font-size:17px;line-height:1;transform:translateY(-1px);}
  .btn .tri{width:0;height:0;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent #000;}

  .lnk{font-size:14px;text-decoration:none;border-bottom:1px solid var(--fg-3);padding-bottom:2px;
    transition:border-color .25s,color .25s;}
  .lnk:hover{border-color:var(--yellow);color:var(--yellow);}

  /* ---------- mobile top header + hamburger ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:60;background:linear-gradient(rgba(24,24,24,.9) 40%,transparent);}
  header .hwrap{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,5vw,40px);}
  header .wm{height:30px;width:auto;display:block;}
  .burger{position:relative;width:34px;height:20px;background:none;border:0;padding:0;cursor:pointer;}
  .burger i{position:absolute;left:0;right:0;height:2.5px;border-radius:2px;background:var(--yellow);
    transition:transform .35s var(--ease),opacity .25s,top .35s var(--ease);}
  .burger i:nth-child(1){top:0;}
  .burger i:nth-child(2){top:50%;transform:translateY(-50%);}
  .burger i:nth-child(3){top:100%;transform:translateY(-100%);}
  .burger.open i:nth-child(1){top:50%;transform:translateY(-50%) rotate(45deg);}
  .burger.open i:nth-child(2){opacity:0;}
  .burger.open i:nth-child(3){top:50%;transform:translateY(-50%) rotate(-45deg);}
  .menu{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.96);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;
    opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s;}
  .menu.open{opacity:1;visibility:visible;}
  .menu a{font-family:var(--display);font-weight:500;font-size:clamp(40px,7vw,64px);letter-spacing:-.035em;
    line-height:1.2;text-decoration:none;padding:6px 18px;
    background:linear-gradient(270deg,#FEFEF9 0%,#7d7d7d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;transform:translateY(26px);transition:transform .55s var(--ease),opacity .55s var(--ease);}
  .menu.open a{opacity:1;transform:none;}
  .menu.open a:nth-child(1){transition-delay:.08s;}
  .menu.open a:nth-child(2){transition-delay:.16s;}
  .menu.open a:nth-child(3){transition-delay:.24s;}
  .menu a:hover{background:linear-gradient(270deg,var(--yellow),var(--yellow));
    -webkit-background-clip:text;background-clip:text;}
  body.menu-open{overflow:hidden;}

  /* ---------- desktop sidebar ---------- */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:40;
    display:flex;flex-direction:column;gap:28px;padding:30px 22px 26px;
    background:rgba(21,21,21,.85);border-right:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .sidebar .wm{height:26px;width:auto;align-self:flex-start;margin-left:6px;}
  .side-play{width:100%;}
  .snav{display:flex;flex-direction:column;gap:6px;}
  .snav a{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:12px;
    text-decoration:none;font-weight:500;font-size:15px;color:var(--fg-2);
    transition:background .2s,color .2s;}
  .snav a:hover{background:rgba(255,255,255,.06);color:var(--fg);}
  .snav a.active{background:rgba(255,255,255,.08);color:var(--yellow);}
  .snav svg,.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .sidebar .sfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;
    font-size:12.5px;color:var(--fg-3);padding-left:6px;}
  .sidebar .sfoot a{text-decoration:none;transition:color .2s;}
  .sidebar .sfoot a:hover{color:var(--yellow);}

  /* ---------- mobile bottom tab bar ---------- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:55;
    display:flex;align-items:flex-end;justify-content:space-around;
    background:rgba(20,20,20,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:10.5px;letter-spacing:.02em;color:var(--fg-3);text-decoration:none;}
  .tab.active{color:var(--yellow);}
  .tab-play{flex:0 0 auto;margin:0 8px;width:58px;height:58px;border-radius:50%;
    background:var(--yellow);transform:translateY(-18px);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 26px rgba(249,255,0,.45);}
  .tab-play i{width:0;height:0;border-style:solid;border-width:10px 0 10px 16px;
    border-color:transparent transparent transparent #000;margin-left:4px;}
  /* while a game is open the play triangle becomes a "next game" down-chevron */
  body.playing .tab-play i{width:15px;height:15px;border-style:solid;border-width:0 3.5px 3.5px 0;
    border-color:#000;border-radius:2px;margin:-7px 0 0;transform:rotate(45deg);}

  /* ---------- layout shell ---------- */
  main{padding:clamp(110px,15vh,150px) clamp(20px,4vw,48px) clamp(60px,8vh,90px);
    max-width:1280px;margin:0 auto;}
  @media (min-width:900px){
    header,.menu,.tabbar{display:none;}
    main{margin-left:250px;max-width:none;padding-top:44px;}
  }
  @media (max-width:899.98px){
    .sidebar{display:none;}
    main{padding-bottom:130px;}
  }

  /* ---------- sign-in strip ---------- */
  .signup{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px 22px;}
  .signup p{margin:0;display:flex;align-items:center;gap:11px;font-size:15.5px;color:var(--fg);}
  .signup .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow);flex:none;}
  .signup .acts{display:flex;align-items:center;gap:20px;}
  .btn.small{padding:11px 18px;font-size:12.5px;border-radius:8px;}
  @media (max-width:560px){.signup{justify-content:center;text-align:center;}}

  /* ---------- today's pick ---------- */
  .pick{display:flex;gap:clamp(24px,4vw,48px);align-items:center;margin-top:24px;
    background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    padding:clamp(20px,3vw,36px);}
  .pick .pthumb{flex:0 0 clamp(150px,20vw,220px);border-radius:16px;overflow:hidden;aspect-ratio:2/3;background:#101010;}
  .pick .pthumb img{width:100%;height:100%;object-fit:cover;object-position:top;}
  .pick .pmeta{display:flex;flex-direction:column;align-items:flex-start;gap:14px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:#000;background:var(--yellow);padding:5px 10px;border-radius:6px;}
  .chip::before{content:'';width:5px;height:5px;border-radius:50%;background:#000;}
  .pick h2{font-family:var(--display);font-weight:600;letter-spacing:-.03em;line-height:1.05;
    font-size:clamp(28px,3.6vw,48px);margin:0;}
  .pick .pmech{font-size:14px;color:var(--fg-2);letter-spacing:.04em;text-transform:uppercase;}
  .pick .btn{margin-top:8px;}
  /* mobile: keep the pick compact — thumb beside meta — so the first rail peeks in */
  @media (max-width:640px){
    .pick{gap:16px;padding:14px;margin-top:16px;}
    .pick .pthumb{flex:0 0 96px;border-radius:12px;}
    .pick .pmeta{gap:8px;}
    .pick h2{font-size:21px;}
    .pick .pmech{font-size:11.5px;}
    .pick .btn{margin-top:2px;padding:11px 16px;font-size:12px;border-radius:9px;}
  }

  /* ---------- rails ---------- */
  .rail{margin-top:clamp(48px,7vh,70px);}
  .rail-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .rail-head h3{font-family:var(--display);font-weight:600;font-size:clamp(21px,2.3vw,27px);letter-spacing:-.02em;margin:0;}
  .rail-head .blurb{font-size:13.5px;color:var(--fg-3);}
  .vgrid{display:flex;gap:clamp(12px,1.6vw,20px);overflow-x:auto;scroll-snap-type:x mandatory;
    padding:4px 4px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;
    -webkit-overflow-scrolling:touch;}
  .vcard{flex:0 0 clamp(160px,20vw,210px);scroll-snap-align:start;text-decoration:none;
    transition:transform .3s var(--ease);}
  .vcard:hover{transform:translateY(-4px);}
  .vcard .vthumb{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:18px;background:#101010;
    border:1px solid var(--glass-line);}
  .vcard .vthumb img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .7s var(--ease);}
  .vcard:hover .vthumb img{transform:scale(1.05);}
  .vcard .vthumb .chip{position:absolute;top:10px;left:10px;}
  .plays-pill{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:7px;
    background:rgba(12,12,12,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--fg);}
  .plays-pill i{width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;
    border-color:transparent transparent transparent var(--yellow);}
  .vcard .vmeta{padding:10px 4px 0;}
  .vcard .vtitle{font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:-.01em;color:var(--fg);}
  .vcard .vmech{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);}
  .vcard.soon{opacity:.45;pointer-events:none;}
  .vcard.soon .chip{background:rgba(255,255,255,.22);color:var(--fg);}
  .vcard.soon .chip::before{background:var(--fg);}
  .chip.medium{background:rgba(255,255,255,.24);color:var(--fg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .chip.medium::before{background:var(--fg);}
  .chip.hard{background:#FF5C39;}

  /* ---------- in-vault game player ---------- */
  .player{position:fixed;z-index:45;left:0;right:0;top:0;bottom:0;
    background:#0b0b0b;display:flex;flex-direction:column;}
  .player[hidden]{display:none;}
  .pbar{flex:none;display:flex;align-items:center;gap:14px;
    padding:10px clamp(14px,2vw,22px);border-bottom:1px solid var(--line);
    background:rgba(21,21,21,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .pback{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
    color:var(--yellow);font-family:var(--body);font-weight:600;font-size:14px;
    padding:9px 11px;border-radius:9px;transition:background .2s;}
  .pback:hover{background:rgba(255,255,255,.06);}
  .ptitle{font-family:var(--display);font-weight:600;font-size:15px;color:var(--fg);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pext{margin-left:auto;font-size:12.5px;color:var(--fg-3);text-decoration:none;white-space:nowrap;}
  .pext:hover{color:var(--yellow);}
  .player iframe{flex:1;width:100%;border:0;background:#000;
    transition:transform .28s var(--ease),opacity .28s var(--ease);}
  .player.adv-out iframe{transform:translateY(-9%);opacity:0;}
  .player.adv-in iframe{transition:none;transform:translateY(9%);opacity:0;}
  body.playing{overflow:hidden;}
  body.playing header{display:none;}
  @media (min-width:900px){.player{left:250px;}}

  /* ambient drifting particles — fixed backdrop behind the shelf, no set direction */
  .particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .particles i{position:absolute;border-radius:50%;opacity:var(--po,.22);
    background:var(--pc,#FEFEF9);box-shadow:0 0 6px 1px var(--pc,#FEFEF9);
    animation:drift var(--pt,14s) ease-in-out infinite alternate;animation-delay:var(--pd,0s);}
  @keyframes drift{
    from{transform:translate(0,0);}
    to{transform:translate(var(--dx,90px),var(--dy,-70px));}}
  @media (prefers-reduced-motion:reduce){.particles{display:none;}}
  main{position:relative;z-index:1;}

  #banner{display:none;margin-top:40px;padding:18px 22px;border:1px solid var(--glass-line);border-radius:14px;
    background:var(--glass);color:var(--fg-2);font-size:15px;}

  footer{border-top:1px solid var(--line);margin-top:clamp(60px,9vh,100px);}
  footer .fwrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:28px 4px 8px;font-size:13px;color:var(--fg-3);}
  footer img{height:15px;width:auto;opacity:.7;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;}
    html{scroll-behavior:auto;}
    .r{opacity:1;transform:none;}
  }
</style>
</head>
<body class="in">

<div class="particles" id="pt-vault" aria-hidden="true"></div>

<!-- mobile top header -->
<header>
  <div class="hwrap">
    <a href="index.html" aria-label="Wolf Games home"><img class="wm" src="assets/wordmark-yellow.svg" alt="Wolf Games"></a>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
  </div>
</header>

<nav class="menu" id="menu" aria-label="Site menu">
  <a href="#">Sign In</a>
  <a href="vault.html">Play Games</a>
  <a href="about.html">About Us</a>
</nav>

<!-- desktop sidebar -->
<aside class="sidebar" aria-label="Vault navigation">
  <a href="index.html" aria-label="Wolf Games home"><img class="wm" src="assets/wordmark-yellow.svg" alt="Wolf Games"></a>
  <a class="btn side-play" id="side-play" href="#" target="_blank" rel="noopener"><span class="tri"></span>Challenge Me</a>
  <nav class="snav">
    <a href="index.html">
      <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 8.5V21h14V8.5"/><path d="M9 21v-6h6v6"/></svg>
      Discover</a>
    <a href="vault.html" class="active">
      <svg viewBox="0 0 24 24"><path d="M6 12h4M8 10v4"/><path d="M15.5 11.5h.01M17.5 13.5h.01"/><path d="M7 6h10a5 5 0 0 1 5 5v3a4 4 0 0 1-7 2.6L13.8 15h-3.6L9 16.6A4 4 0 0 1 2 14v-3a5 5 0 0 1 5-5z"/></svg>
      My Vault</a>
    <a href="#">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
      Sign In</a>
  </nav>
  <div class="sfoot">
    <a href="https://discord.gg/YfG3sTYTxs" target="_blank" rel="noopener">Discord</a>
    <span>@Wolfgames</span>
    <span>© 2026 Wolf Games</span>
  </div>
</aside>

<main>
  <div id="banner"></div>

  <div class="signup r in">
    <p><span class="dot"></span>Sign in to unlock more games and rewards.</p>
    <div class="acts">
      <a class="btn small" href="#">Sign Up</a>
      <a class="lnk" href="#">Sign In</a>
    </div>

  <footer>
    <div class="fwrap">
      <img src="assets/wordmark-yellow.svg" alt="Wolf Games">
      <span>Stories You Play.</span>
      <span>© 2026 Wolf Games</span>

</main>

<!-- in-vault game player -->
<div class="player" id="player" hidden>
  <div class="pbar">
    <button class="pback" id="p-back" type="button">&larr; Back</button>
    <a class="pext" id="p-ext" href="#" target="_blank" rel="noopener">Open in new tab &#8599;</a>
  </div>

</div>

<!-- mobile bottom tab bar -->
<nav class="tabbar" aria-label="Vault tabs">
  <a class="tab active" href="vault.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2z"/></svg>
    Discover</a>
  <a class="tab-play" id="tab-play" href="#" target="_blank" rel="noopener" aria-label="Play today's edition"><i></i></a>
  <a class="tab" href="#">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="4.5"/><path d="M12 7.5V5.5M12 18.5v-2M16.5 12h2M5.5 12h2"/></svg>
    My Vault</a>
</nav>

<script>
/* ---- always fetch the latest build of internal pages ---- */
(function(){
  var t=Date.now();
  document.querySelectorAll('a[href$="index.html"],a[href$="vault.html"],a[href$="about.html"]').forEach(function(a){
    a.href=a.getAttribute('href')+'?t='+t;
  });
})();

/* ---- ambient drifting particles ---- */
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var el=document.getElementById('pt-vault'); if(!el) return;
  for(var i=0;i<26;i++){
    var p=document.createElement('i');
    var s=(1.4+Math.random()*2.4).toFixed(1);
    /* guarantee a visible amount of travel in a random direction */
    var ang=Math.random()*Math.PI*2, dist=70+Math.random()*80;
    p.style.left=(Math.random()*100).toFixed(2)+'%';
    p.style.top=(Math.random()*100).toFixed(2)+'%';
    p.style.width=s+'px'; p.style.height=s+'px';
    p.style.setProperty('--pt',(10+Math.random()*8).toFixed(1)+'s');
    p.style.setProperty('--pd',(-Math.random()*10).toFixed(1)+'s');
    p.style.setProperty('--dx',Math.round(Math.cos(ang)*dist)+'px');
    p.style.setProperty('--dy',Math.round(Math.sin(ang)*dist)+'px');
    p.style.setProperty('--po',(0.12+Math.random()*0.22).toFixed(2));
    el.appendChild(p);
  }
})();

/* ---- hamburger (mobile) ---- */
(function(){
  var burger=document.getElementById('burger'), menu=document.getElementById('menu');
  function setOpen(open){
    burger.classList.toggle('open',open);
    menu.classList.toggle('open',open);
    document.body.classList.toggle('menu-open',open);
    burger.setAttribute('aria-expanded',open?'true':'false');
  }
  burger.addEventListener('click',function(){setOpen(!menu.classList.contains('open'));});
  menu.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setOpen(false);});});
  window.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
})();

/* ---- in-vault game player ---- */
var WGPlayer=(function(){
  var el=document.getElementById('player'),
      frame=document.getElementById('p-frame'),
      ext=document.getElementById('p-ext'),
      back=document.getElementById('p-back'),
      tabbar=document.querySelector('.tabbar'),
      tabPlay=document.getElementById('tab-play'),
      returnTo=null;

  function setSrc(url){frame.src=url; ext.href=url;}

  function fit(){
    if(el.hidden) return;
    var mobile=window.matchMedia('(max-width: 899.98px)').matches;
    el.style.bottom=(mobile&&tabbar)?tabbar.offsetHeight+'px':'0px';
  }
  function open(url,name,opts){
    if(!el.hidden){
      /* already playing — swipe the current game up and out, next one in from below */
      el.classList.add('adv-out');
      setTimeout(function(){
        setSrc(url);
        el.classList.remove('adv-out'); el.classList.add('adv-in');
        requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.remove('adv-in');});});
      },280);
      return;
    }
    setSrc(url);
    el.hidden=false; document.body.classList.add('playing');
    if(tabPlay) tabPlay.setAttribute('aria-label','Next game');
    fit();
    /* returnTo: the page we should land on when "Back" is pressed. Only set when the
       player was opened by arriving fresh from another page (e.g. the homepage) — in
       that case skip pushState so a real navigation, not a fake history entry, sends
       the user back to where they actually came from. */
    returnTo=(opts&&opts.returnTo)||null;
    if(!returnTo) history.pushState({wgPlayer:1},'');
  }
  function hide(){
    if(el.hidden) return;
    el.hidden=true; frame.src='about:blank';
    document.body.classList.remove('playing');
    if(tabPlay) tabPlay.setAttribute('aria-label','Play today’s edition');
    returnTo=null;
  }
  function close(fromPop){
    if(el.hidden) return;
    var to=returnTo;
    hide();
    if(fromPop) return;
    if(to){ location.href=to; return; }
    if(history.state && history.state.wgPlayer) history.back();
  }
  back.addEventListener('click',function(){close(false);});
  window.addEventListener('popstate',function(){close(true);});
  window.addEventListener('resize',fit);
  window.addEventListener('keydown',function(e){if(e.key==='Escape')close(false);});
  /* tapping My Arcade while playing exits back to the shelf instead of reloading */
  document.querySelectorAll('.snav a.active,.tab.active').forEach(function(a){
    a.addEventListener('click',function(e){
      if(!el.hidden){e.preventDefault();hide();}
    });
  });
  return {open:open,close:close,isOpen:function(){return !el.hidden;}};
})();

/* ---- vault shelf ---- */
(function(){
  var MECH={1:'Hypercasual',2:'Competitive',3:'Narrative serial'};
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

  fetch('/data/vault.json').then(function(r){
    if(!r.ok) throw new Error('vault.json → '+r.status);
    return r.json();
  }).then(function(data){
    var games=data.games.map(function(g){g.mechanic=MECH[g.tier]||'Game';return g;});
    var avail=games.filter(function(g){return g.available;});

    /* the shelf doubles as a playlist: while playing, the tab-bar button advances through it */
    var current=-1;
    function playGame(g,opts){current=avail.indexOf(g);WGPlayer.open(g.url,g.title,opts);}
    function nextGame(){
      if(!avail.length) return;
      current=(current+1)%avail.length;
      var g=avail[current]; WGPlayer.open(g.url,g.title);
    }

    /* arriving from a game link elsewhere on the site (e.g. homepage) — open straight into the
       player, and remember where we came from so "Back" returns there instead of the shelf */
    var playSlug=new URLSearchParams(location.search).get('play');
    if(playSlug){
      var linked=avail.filter(function(g){return g.slug===playSlug;})[0];
      if(linked){
        var cameFrom=null;
        try{
          if(document.referrer && new URL(document.referrer).origin===location.origin) cameFrom=document.referrer;
        }catch(e){}
        playGame(linked,{returnTo:cameFrom});
      }
    }

    /* today's pick: rotate daily through available narrative games, fall back to any */
    var pool=avail.filter(function(g){return g.tier===3;});
    if(!pool.length) pool=avail;
    var day=Math.floor(Date.now()/86400000);
    var pick=pool.length?pool[day%pool.length]:null;

    if(pick){
      document.getElementById('pick').innerHTML=
        '<div class="pick r d2 in">'+
          '<div class="pthumb">'+(pick.thumb?'<img src="'+esc(pick.thumb)+'" alt="">':'')+'</div>'+
          '<div class="pmeta">'+
            '<span class="chip">Today’s Pick</span>'+
            '<h2>'+esc(pick.title)+'</h2>'+
            '<span class="pmech">'+esc(pick.mechanic)+' · new edition daily</span>'+
            '<a class="btn" href="'+esc(pick.url)+'" target="_blank" rel="noopener">Play today’s edition <span class="arrow">→</span></a>'+
          '</div>'+
        '</div>';
      document.querySelector('#pick .btn').addEventListener('click',function(e){
        e.preventDefault(); playGame(pick);
      });
      var sideBtn=document.getElementById('side-play');
      if(sideBtn){
        sideBtn.href=pick.url;
        sideBtn.addEventListener('click',function(e){e.preventDefault(); playGame(pick);});
      }
      var tabBtn=document.getElementById('tab-play');
      if(tabBtn){
        tabBtn.href=pick.url;
        tabBtn.addEventListener('click',function(e){
          e.preventDefault();
          /* on the shelf it plays today's pick; while playing it swipes to the next game */
          if(WGPlayer.isOpen()) nextGame(); else playGame(pick);
        });
      }
    }

    var railsEl=document.getElementById('rails');
    var RAIL_NAMES={1:'Trending Editions',2:'Test Your Brain'};
    [1,2,3].forEach(function(t){
      var tier=data.tiers[t]; var list=games.filter(function(g){return g.tier===t;});
      if(!tier||!list.length) return;
      var name=RAIL_NAMES[t]||(tier.label||'').split('·').pop().trim()||('Tier '+t);
      var rail=document.createElement('section');
      rail.className='rail';
      rail.innerHTML='<div class="rail-head"><h3>'+esc(name)+'</h3><span class="blurb">'+esc(tier.blurb||'')+'</span></div>';
      var grid=document.createElement('div');grid.className='vgrid';
      list.forEach(function(g){
        var live=!!g.available;
        var el=document.createElement(live?'a':'div');
        el.className='vcard'+(live?'':' soon');
        if(live){
          el.href=g.url;el.target='_blank';el.rel='noopener';
          el.addEventListener('click',function(e){
            e.preventDefault(); playGame(g);
          });
        }
        /* placeholder difficulty + play count: seeded from slug so they vary per game but stay stable */
        var h=0; for(var i=0;i<g.slug.length;i++){h=(h*33+g.slug.charCodeAt(i))>>>0;}
        h=(((h^(h>>>7))>>>0)*2654435761)>>>0; h=(h^(h>>>16))>>>0;
        var diff=['Easy','Medium','Hard'][h%3];
        var plays=40000+(h%1460000);
        var playsFmt=plays>=1000000?(plays/1000000).toFixed(1)+'M':Math.round(plays/1000)+'K';
        var chip=live
          ? '<span class="chip '+diff.toLowerCase()+'">'+diff+'</span>'
          : '<span class="chip">Soon</span>';
        el.innerHTML=
          '<div class="vthumb">'+(g.thumb?'<img src="'+esc(g.thumb)+'" alt="" loading="lazy">':'')+chip+
            '<span class="plays-pill"><i></i>'+playsFmt+'</span></div>'+
          '<div class="vmeta"><div class="vtitle">'+esc(g.title)+'</div>'+
            '<span class="vmech">'+esc(g.mechanic)+'</span></div>';
        grid.appendChild(el);
      });
      rail.appendChild(grid);
      railsEl.appendChild(rail);
    });
  }).catch(function(e){
    var b=document.getElementById('banner');
    b.style.display='block';
    b.textContent='The shelf is restocking — check back shortly. ('+e.message+')';
  });
})();
</script>
